apiVersion: v1
kind: Service
metadata:
  name: ruleshift-gateway
  namespace: ruleshift-core
  labels:
    app: ruleshift-gateway
    ruleshift.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app: ruleshift-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

