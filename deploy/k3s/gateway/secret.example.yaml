apiVersion: v1
kind: Secret
metadata:
  name: ruleshift-gateway-secrets
  namespace: ruleshift-core
type: Opaque
stringData:
  RULESHIFT_DATABASE_URL: "postgres://ruleshift:REPLACE_ME@postgres.ruleshift-core.svc:5432/ruleshift_control?sslmode=disable"
  RULESHIFT_DATABASE_ADMIN_URL: "postgres://ruleshift:REPLACE_ME@postgres.ruleshift-core.svc:5432/postgres?sslmode=disable"
  RULESHIFT_DEVELOPER_API_KEY: "REPLACE_WITH_AT_LEAST_16_RANDOM_CHARACTERS"
  RULESHIFT_PUBLIC_ROOM_REF_KEY: "REPLACE_WITH_AT_LEAST_32_RANDOM_BYTES"

