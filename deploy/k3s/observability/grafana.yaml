apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ruleshift-grafana-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruleshift-grafana
  labels:
    app: ruleshift-grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ruleshift-grafana
  template:
    metadata:
      labels:
        app: ruleshift-grafana
    spec:
      securityContext:
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: grafana
          image: grafana/grafana:13.0.2
          imagePullPolicy: IfNotPresent
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_SECURITY_ALLOW_EMBEDDING, value: "false"}
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ruleshift-grafana-admin
                  key: password
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 768Mi}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yml, subPath: datasources.yml, readOnly: true}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards/system-overview.json, subPath: system-overview.json, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards/runtime-diagnostics.json, subPath: runtime-diagnostics.json, readOnly: true}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - name: provisioning
          configMap: {name: ruleshift-grafana-provisioning}
        - name: dashboards
          configMap: {name: ruleshift-grafana-dashboards}
        - name: data
          persistentVolumeClaim: {claimName: ruleshift-grafana-data}
---
apiVersion: v1
kind: Service
metadata:
  name: ruleshift-grafana
spec:
  type: ClusterIP
  selector: {app: ruleshift-grafana}
  ports:
    - {name: http, port: 3000, targetPort: http}
