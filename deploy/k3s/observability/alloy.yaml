apiVersion: v1
kind: ServiceAccount
metadata:
  name: ruleshift-alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ruleshift-alloy-pod-logs
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ruleshift-alloy-pod-logs
subjects:
  - kind: ServiceAccount
    name: ruleshift-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ruleshift-alloy-pod-logs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruleshift-alloy
  labels: {app: ruleshift-alloy}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ruleshift-alloy}
  template:
    metadata:
      labels: {app: ruleshift-alloy}
    spec:
      serviceAccountName: ruleshift-alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.16.1
          imagePullPolicy: IfNotPresent
          args: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy]
          ports:
            - {name: http, containerPort: 12345}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/alloy/config.alloy, subPath: config.alloy, readOnly: true}
            - {name: data, mountPath: /var/lib/alloy}
      volumes:
        - name: config
          configMap: {name: ruleshift-alloy-config}
        - name: data
          emptyDir: {}
