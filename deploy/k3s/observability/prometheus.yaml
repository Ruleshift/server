apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ruleshift-prometheus-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruleshift-prometheus
  labels:
    app: ruleshift-prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ruleshift-prometheus
  template:
    metadata:
      labels:
        app: ruleshift-prometheus
    spec:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: prometheus
          image: prom/prometheus:v3.12.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 768Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml, readOnly: true}
            - {name: config, mountPath: /etc/prometheus/rules.yml, subPath: rules.yml, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: ruleshift-prometheus-config}
        - name: data
          persistentVolumeClaim: {claimName: ruleshift-prometheus-data}
---
apiVersion: v1
kind: Service
metadata:
  name: ruleshift-prometheus
spec:
  type: ClusterIP
  selector: {app: ruleshift-prometheus}
  ports:
    - {name: http, port: 9090, targetPort: http}
