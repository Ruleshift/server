apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ruleshift-loki-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruleshift-loki
  labels:
    app: ruleshift-loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: ruleshift-loki}
  template:
    metadata:
      labels: {app: ruleshift-loki}
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: loki
          image: grafana/loki:3.7.2
          imagePullPolicy: IfNotPresent
          args: [-config.file=/etc/loki/config.yml]
          ports:
            - {name: http, containerPort: 3100}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/loki/config.yml, subPath: config.yml, readOnly: true}
            - {name: data, mountPath: /loki}
      volumes:
        - name: config
          configMap: {name: ruleshift-loki-config}
        - name: data
          persistentVolumeClaim: {claimName: ruleshift-loki-data}
---
apiVersion: v1
kind: Service
metadata:
  name: ruleshift-loki
spec:
  type: ClusterIP
  selector: {app: ruleshift-loki}
  ports:
    - {name: http, port: 3100, targetPort: http}
