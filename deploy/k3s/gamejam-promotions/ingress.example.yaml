apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gamejam-verification-rate-limit
  namespace: ruleshift-core
spec:
  rateLimit: {average: 10, period: 1m, burst: 10}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gamejam-admin-rate-limit
  namespace: ruleshift-core
spec:
  rateLimit: {average: 20, period: 1m, burst: 10}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ruleshift-gamejam-promotions-public
  namespace: ruleshift-core
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: ruleshift-core-gamejam-verification-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [user.ruleshift.ru]
      secretName: user-ruleshift-tls
  rules:
    - host: user.ruleshift.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: ruleshift-gamejam-promotions-public, port: {number: 8082}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ruleshift-gamejam-promotions-admin
  namespace: ruleshift-core
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: ruleshift-core-gamejam-admin-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [admin.ruleshift.ru]
      secretName: admin-ruleshift-tls
  rules:
    - host: admin.ruleshift.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: ruleshift-gamejam-promotions-admin, port: {number: 9092}}
