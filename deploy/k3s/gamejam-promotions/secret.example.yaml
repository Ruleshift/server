apiVersion: v1
kind: Secret
metadata:
  name: ruleshift-gamejam-promotions
  namespace: ruleshift-core
type: Opaque
stringData:
  database-url: postgres://ruleshift:replace-me@postgres.example:5432/ruleshift_gamejam?sslmode=require
  # Base64 encoding of exactly 32 random bytes. Keep stable and back it up with PostgreSQL.
  code-master-key: REPLACE_WITH_BASE64_32_BYTE_KEY
  admin-username: ruleshift-admin
  # Generate with bcrypt and keep the $ characters verbatim in this YAML value.
  admin-password-bcrypt: REPLACE_WITH_BCRYPT_HASH
