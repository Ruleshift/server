apiVersion: v1
kind: ServiceAccount
metadata:
  name: ruleshift-alloy
  namespace: ruleshift-core
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ruleshift-alloy-pod-logs
  namespace: ruleshift-core
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ruleshift-alloy-pod-logs
  namespace: ruleshift-core
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ruleshift-alloy-pod-logs
subjects:
- kind: ServiceAccount
  name: ruleshift-alloy
  namespace: ruleshift-core
---
apiVersion: v1
data:
  config.alloy: |
    logging {
      level = "info"
    }

    discovery.kubernetes "ruleshift_pods" {
      role = "pod"
      namespaces {
        names = ["ruleshift-core"]
      }
    }

    discovery.relabel "ruleshift_gateway" {
      targets = discovery.kubernetes.ruleshift_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        regex         = "ruleshift-gateway"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "component"
      }

      rule {
        target_label = "service"
        replacement  = "ruleshift"
      }

      rule {
        target_label = "environment"
        replacement  = "production"
      }
    }

    loki.source.kubernetes "ruleshift_gateway" {
      targets    = discovery.relabel.ruleshift_gateway.output
      forward_to = [loki.process.ruleshift_gateway.receiver]
    }

    loki.process "ruleshift_gateway" {
      stage.json {
        expressions = {
          level = "level",
        }
      }

      stage.labels {
        values = {
          level = "level",
        }
      }

      // Identifiers are never promoted to Loki labels.
      stage.label_drop {
        values = ["room_id", "public_room_ref", "player_id", "developer_id", "trace_id", "pod", "instance"]
      }

      forward_to = [loki.write.local.receiver]
    }

    loki.write "local" {
      endpoint {
        url = "http://ruleshift-loki:3100/loki/api/v1/push"
      }
    }
