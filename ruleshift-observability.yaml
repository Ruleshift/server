kind: ConfigMap
metadata:
  name: ruleshift-grafana-dashboards-b8cddg67b9
  namespace: ruleshift-core
---
apiVersion: v1
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: Ruleshift
        folder: Ruleshift
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: ruleshift-prometheus
        type: prometheus
        access: proxy
        url: http://ruleshift-prometheus:9090
        isDefault: true
        editable: false
      - name: Loki
        uid: ruleshift-loki
        type: loki
        access: proxy
        url: http://ruleshift-loki:3100
        editable: false
kind: ConfigMap
metadata:
  name: ruleshift-grafana-provisioning-79fmghcg28
  namespace: ruleshift-core
---
apiVersion: v1
data:
  config.yml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      filesystem:
        directory: /loki/chunks

    limits_config:
      retention_period: 168h
      allow_structured_metadata: true

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
kind: ConfigMap
metadata:
  name: ruleshift-loki-config-hkc4kk8mgf
  namespace: ruleshift-core
---
apiVersion: v1
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    rule_files:
      - /etc/prometheus/rules.yml

    scrape_configs:
      - job_name: ruleshift
        metrics_path: /metrics
        static_configs:
          - targets: [ruleshift-operations:9091]
  rules.yml: |
    groups:
      - name: ruleshift-overview
        interval: 10s
        rules:
          - record: ruleshift:command_rate5m
            expr: sum(rate(ruleshift_gateway_commands_total[5m]))
          - record: ruleshift:server_error_ratio5m
            expr: sum(rate(ruleshift_gateway_commands_total{result=~"error|module_unavailable|timeout"}[5m])) / clamp_min(sum(rate(ruleshift_gateway_commands_total[5m])), 1)
          - record: ruleshift:command_p95_seconds5m
            expr: histogram_quantile(0.95, sum by (le) (rate(ruleshift_gateway_command_duration_seconds_bucket[5m])))
          - record: ruleshift:slow_consumer_ratio5m
            expr: sum(rate(ruleshift_gateway_slow_consumers_total[5m])) / clamp_min(sum(rate(ruleshift_gateway_connections_opened_total[5m])), 1)
