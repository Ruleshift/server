apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ruleshift-alloy
  name: ruleshift-alloy
  namespace: ruleshift-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruleshift-alloy
  template:
    metadata:
      labels:
        app: ruleshift-alloy
    spec:
      containers:
      - args:
        - run
        - /etc/alloy/config.alloy
        - --storage.path=/var/lib/alloy
        image: grafana/alloy:v1.16.1
        imagePullPolicy: IfNotPresent
        name: alloy
        ports:
        - containerPort: 12345
          name: http
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 300m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /etc/alloy/config.alloy
          name: config
          readOnly: true
          subPath: config.alloy
        - mountPath: /var/lib/alloy
          name: data
      serviceAccountName: ruleshift-alloy
      volumes:
      - configMap:
          name: ruleshift-alloy-config-9md96cc2t5
        name: config
      - emptyDir: {}
        name: data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ruleshift-grafana
  name: ruleshift-grafana
  namespace: ruleshift-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruleshift-grafana
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ruleshift-grafana
    spec:
      containers:
      - env:
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "false"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_SECURITY_ALLOW_EMBEDDING
          value: "false"
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: ruleshift-grafana-admin
        image: grafana/grafana:13.0.2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
        name: grafana
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: "1"
            memory: 768Mi
          requests:
            cpu: 100m
            memory: 192Mi
        volumeMounts:
        - mountPath: /etc/grafana/provisioning/datasources/datasources.yml
          name: provisioning
          readOnly: true
          subPath: datasources.yml
        - mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
          name: provisioning
          readOnly: true
          subPath: dashboards.yml
        - mountPath: /var/lib/grafana/dashboards/system-overview.json
          name: dashboards
          readOnly: true
          subPath: system-overview.json
        - mountPath: /var/lib/grafana/dashboards/runtime-diagnostics.json
          name: dashboards
          readOnly: true
          subPath: runtime-diagnostics.json
        - mountPath: /var/lib/grafana
          name: data
      securityContext:
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
      volumes:
      - configMap:
          name: ruleshift-grafana-provisioning-79fmghcg28
        name: provisioning
      - configMap:
          name: ruleshift-grafana-dashboards-b8cddg67b9
        name: dashboards
      - name: data
        persistentVolumeClaim:
          claimName: ruleshift-grafana-data
