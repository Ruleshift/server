openapi: 3.1.0
info:
  title: Ruleshift Developer API
  version: 2.0.0
  description: Tenant-scoped API for trusted backends, Editor tooling and CI. Never embed its key in a player build.
servers:
  - url: http://localhost:8080
security:
  - developerKey: []
paths:
  /v2/developer/registry-credentials/{name}:
    put:
      operationId: putRegistryCredential
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server, username]
              properties:
                server: {type: string}
                username: {type: string}
                password: {type: string, writeOnly: true}
                token: {type: string, writeOnly: true}
      responses:
        "204": {description: Stored only as a tenant Kubernetes pull Secret}
  /v2/developer/modules:
    post:
      operationId: createModule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, display_name]
              properties:
                key: {type: string, pattern: "^[a-z][a-z0-9_]{0,47}$"}
                display_name: {type: string}
      responses:
        "201": {description: Module key created, content: {application/json: {schema: {$ref: "#/components/schemas/Module"}}}}
  /v2/developer/modules/{module}/versions:
    post:
      operationId: publishModuleVersion
      parameters:
        - {$ref: "#/components/parameters/Module"}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [manifest, descriptor_set, conformance_vectors, oci_reference]
              properties:
                manifest: {type: string, format: binary}
                descriptor_set: {type: string, format: binary}
                conformance_vectors: {type: string, format: binary}
                oci_reference: {type: string, pattern: "^.+@sha256:[0-9a-f]{64}$"}
                registry_credential: {type: string}
      responses:
        "201": {description: Validated and automatically activated version, content: {application/json: {schema: {$ref: "#/components/schemas/ModuleVersion"}}}}
        "409": {description: Existing SemVer has another digest}
        "422": {description: Validation failed}
  /v2/developer/modules/{module}/versions/{version}:
    get:
      operationId: getModuleVersion
      parameters:
        - {$ref: "#/components/parameters/Module"}
        - {$ref: "#/components/parameters/Version"}
      responses:
        "200": {description: Version, content: {application/json: {schema: {$ref: "#/components/schemas/ModuleVersion"}}}}
  /v2/developer/modules/{module}/versions/{version}/validation:
    get:
      operationId: getValidationStatus
      parameters:
        - {$ref: "#/components/parameters/Module"}
        - {$ref: "#/components/parameters/Version"}
      responses:
        "200": {description: Bounded validation result and logs, content: {application/json: {schema: {$ref: "#/components/schemas/ValidationRun"}}}}
  /v2/developer/modules/{module}/tables/{table}/rows:
    get:
      operationId: listRows
      parameters:
        - {$ref: "#/components/parameters/Module"}
        - {name: table, in: path, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
      responses:
        "200": {description: Bounded row page}
    post:
      operationId: createRow
      parameters:
        - {$ref: "#/components/parameters/Module"}
        - {name: table, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values: {type: object, additionalProperties: true}
      responses:
        "201": {description: Created row}
  /v2/rooms:
    post:
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [module_id]
              properties:
                module_id: {type: string}
                version: {type: string, description: Optional pinned version; active is selected when omitted}
      responses:
        "201": {description: Pinned room route, content: {application/json: {schema: {$ref: "#/components/schemas/RoomRoute"}}}}
  /v2/rooms/{room_id}:
    get:
      operationId: getRoom
      parameters:
        - {name: room_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Tenant-owned room route, content: {application/json: {schema: {$ref: "#/components/schemas/RoomRoute"}}}}
components:
  securitySchemes:
    developerKey: {type: http, scheme: bearer}
  parameters:
    Module: {name: module, in: path, required: true, schema: {type: string}}
    Version: {name: version, in: path, required: true, schema: {type: string}}
  schemas:
    Module:
      type: object
      properties:
        developer_id: {type: string}
        key: {type: string}
        display_name: {type: string}
        active_version: {type: string}
    ModuleRef:
      type: object
      required: [developer_id, module_id, version, image_digest]
      properties:
        developer_id: {type: string}
        module_id: {type: string}
        version: {type: string}
        image_digest: {type: string}
    ModuleVersion:
      type: object
      properties:
        ref: {$ref: "#/components/schemas/ModuleRef"}
        image_ref: {type: string}
        abi_version: {type: integer}
        descriptor_digest: {type: string}
        manifest: {type: object, additionalProperties: true}
        status: {type: string, enum: [validating, active, inactive, failed, degraded]}
    ValidationRun:
      type: object
      properties:
        result: {type: string}
        logs: {type: string, maxLength: 65536}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
    RoomRoute:
      type: object
      required: [room_id, module, module_database, seed]
      properties:
        room_id: {type: string}
        module: {$ref: "#/components/schemas/ModuleRef"}
        module_database: {type: string}
        seed: {type: integer, minimum: 0}
