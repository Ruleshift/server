openapi: 3.1.0
info:
  title: Ruleshift Developer API
  version: 0.1.0
  description: Tenant-scoped API used by Ruleshift developer SDKs. Developer keys must never ship in player builds.
servers:
  - url: http://localhost:8080
security:
  - developerKey: []
paths:
  /v1/developer/modules:
    get:
      operationId: listModules
      responses:
        "200":
          description: Developer modules
          content:
            application/json:
              schema:
                type: object
                required: [modules]
                properties:
                  modules:
                    type: array
                    items: { $ref: "#/components/schemas/Module" }
    post:
      operationId: createModule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateModuleRequest" }
      responses:
        "201":
          description: Provisioned module
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Module" }
  /v1/developer/modules/{module}/schema:
    get:
      operationId: getModuleSchema
      parameters:
        - $ref: "#/components/parameters/Module"
      responses:
        "200":
          description: Effective module database schema
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schema" }
  /v1/developer/modules/{module}/tables/{table}/rows:
    get:
      operationId: listRows
      parameters:
        - $ref: "#/components/parameters/Module"
        - $ref: "#/components/parameters/Table"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
      responses:
        "200":
          description: Bounded page of rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RowsPage" }
    post:
      operationId: createRow
      parameters:
        - $ref: "#/components/parameters/Module"
        - $ref: "#/components/parameters/Table"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Created row
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Row" }
components:
  securitySchemes:
    developerKey:
      type: http
      scheme: bearer
  parameters:
    Module:
      name: module
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,47}$" }
    Table:
      name: table
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,47}$" }
  schemas:
    Module:
      type: object
      required: [key, display_name, game_type, created_at]
      properties:
        key: { type: string }
        display_name: { type: string }
        game_type: { type: integer }
        created_at: { type: string, format: date-time }
    CreateModuleRequest:
      type: object
      required: [key, display_name, schema]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,47}$" }
        display_name: { type: string }
        schema:
          type: object
          required: [tables]
          properties:
            tables:
              type: array
              maxItems: 32
              items:
                type: object
                required: [name, columns]
                properties:
                  name: { type: string }
                  columns:
                    type: array
                    minItems: 1
                    maxItems: 128
                    items:
                      type: object
                      required: [name, type]
                      properties:
                        name: { type: string }
                        type:
                          type: string
                          enum: [string, int64, float64, bool, timestamp, json]
                        nullable: { type: boolean, default: false }
                        primary_key: { type: boolean, default: false }
    Schema:
      type: object
      required: [module, tables]
      properties:
        module: { type: string }
        tables:
          type: array
          items:
            type: object
            additionalProperties: true
    RowsPage:
      type: object
      required: [module, table, columns, rows, limit, offset]
      properties:
        module: { type: string }
        table: { type: string }
        columns: { type: array, items: { type: string } }
        rows: { type: array, items: { type: object, additionalProperties: true } }
        limit: { type: integer }
        offset: { type: integer }
    Row:
      type: object
      required: [module, table, values]
      properties:
        module: { type: string }
        table: { type: string }
        values: { type: object, additionalProperties: true }
