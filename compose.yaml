services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ruleshift
      POSTGRES_PASSWORD: ruleshift-dev
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruleshift -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - ruleshift-postgres:/var/lib/postgresql/data
volumes:
  ruleshift-postgres:
