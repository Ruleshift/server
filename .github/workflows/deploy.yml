name: Build, publish, and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ruleshift-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      gateway_image: ${{ steps.images.outputs.gateway }}
      observability_image: ${{ steps.images.outputs.observability }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set image names
        id: images
        shell: bash
        run: |
          gateway="ghcr.io/${GITHUB_REPOSITORY,,}"
          observability="${gateway}-observability"
          echo "gateway=$gateway" >> "$GITHUB_OUTPUT"
          echo "observability=$observability" >> "$GITHUB_OUTPUT"
          echo "GATEWAY_IMAGE=$gateway" >> "$GITHUB_ENV"
          echo "OBSERVABILITY_IMAGE=$observability" >> "$GITHUB_ENV"

      - name: Build gateway image
        run: |
          docker build \
            --build-arg BINARY=./cmd/gateway \
            -t "$GATEWAY_IMAGE:latest" \
            -t "$GATEWAY_IMAGE:${{ github.sha }}" \
            .

      - name: Build observability API image
        run: |
          docker build \
            --build-arg BINARY=./cmd/observability-api \
            -t "$OBSERVABILITY_IMAGE:latest" \
            -t "$OBSERVABILITY_IMAGE:${{ github.sha }}" \
            .

      - name: Push images
        run: |
          docker push "$GATEWAY_IMAGE:latest"
          docker push "$GATEWAY_IMAGE:${{ github.sha }}"
          docker push "$OBSERVABILITY_IMAGE:latest"
          docker push "$OBSERVABILITY_IMAGE:${{ github.sha }}"

  deploy:
    if: vars.K3S_AUTO_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_DNS_NAME: ${{ secrets.SERVER_DNS_NAME }}
          SERVER_LOGIN: ${{ secrets.SERVER_LOGIN }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SERVER_DNS_NAME" || { echo "SERVER_DNS_NAME is empty"; exit 1; }
          test -n "$SERVER_LOGIN" || { echo "SERVER_LOGIN is empty"; exit 1; }
          test -n "$SERVER_PASSWORD" || { echo "SERVER_PASSWORD is empty"; exit 1; }

          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -H "$SERVER_DNS_NAME" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "Could not read the VPS SSH host key"; exit 1; }
          chmod 600 ~/.ssh/known_hosts

          askpass="$RUNNER_TEMP/ruleshift-ssh-askpass"
          printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$SERVER_PASSWORD"' > "$askpass"
          chmod 700 "$askpass"
          echo "SSH_ASKPASS=$askpass" >> "$GITHUB_ENV"
          echo "SSH_ASKPASS_REQUIRE=force" >> "$GITHUB_ENV"
          echo "DISPLAY=:0" >> "$GITHUB_ENV"

      - name: Render k3s manifests
        env:
          OBSERVABILITY_IMAGE: ${{ needs.build.outputs.observability_image }}
        run: |
          kubectl kustomize deploy/k3s/observability --load-restrictor=LoadRestrictionsNone > /tmp/ruleshift-observability.yaml
          sed -i "s#image: ghcr.io/ruleshift/server-observability:latest#image: ${OBSERVABILITY_IMAGE}:${{ github.sha }}#" /tmp/ruleshift-observability.yaml

      - name: Deploy to k3s
        env:
          SERVER_DNS_NAME: ${{ secrets.SERVER_DNS_NAME }}
          SERVER_LOGIN: ${{ secrets.SERVER_LOGIN }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          GATEWAY_IMAGE: ${{ needs.build.outputs.gateway_image }}
          OBSERVABILITY_IMAGE: ${{ needs.build.outputs.observability_image }}
        run: |
          set -euo pipefail
          remote="${SERVER_LOGIN}@${SERVER_DNS_NAME}"
          ssh_options=(
            -o BatchMode=no
            -o PreferredAuthentications=password,keyboard-interactive
            -o PubkeyAuthentication=no
            -o NumberOfPasswordPrompts=1
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )
          remote_ssh() {
            setsid -w ssh "${ssh_options[@]}" "$remote" "$@"
          }

          echo "Connected to VPS; current cluster pods:"
          remote_ssh "kubectl get pods -A"
          remote_ssh "k3s kubectl -n ruleshift-core get secret ruleshift-observability-secret >/dev/null && k3s kubectl -n ruleshift-core get secret ruleshift-grafana-admin >/dev/null"
          remote_ssh "k3s kubectl apply -f -" < /tmp/ruleshift-observability.yaml
          remote_ssh "k3s kubectl -n ruleshift-core set env deployment/ruleshift-gateway --from=configmap/ruleshift-gateway-observability"
          remote_ssh "k3s kubectl -n ruleshift-core set env deployment/ruleshift-gateway --from=secret/ruleshift-observability-secret"
          remote_ssh "k3s kubectl -n ruleshift-core set image deployment/ruleshift-gateway gateway=${GATEWAY_IMAGE}:${{ github.sha }}"
          remote_ssh "k3s kubectl -n ruleshift-core rollout status deployment/ruleshift-gateway --timeout=180s"
          remote_ssh "k3s kubectl -n ruleshift-core rollout status deployment/ruleshift-observability-api --timeout=180s"

          echo "Cluster pods after deployment:"
          remote_ssh "kubectl get pods -A"

      - name: Remove SSH password helper
        if: always()
        run: |
          rm -f "${SSH_ASKPASS:-}"
