name: Build, publish, and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ruleshift-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      gateway_image: ${{ steps.images.outputs.gateway }}
      observability_image: ${{ steps.images.outputs.observability }}
      gamejam_promotions_image: ${{ steps.images.outputs.gamejam_promotions }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ruleshift_gamejam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ruleshift_gamejam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run game jam PostgreSQL integration tests
        env:
          GAMEJAM_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ruleshift_gamejam_test?sslmode=disable
        run: go test -tags=integration ./internal/gamejampromo

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set image names
        id: images
        shell: bash
        run: |
          gateway="ghcr.io/${GITHUB_REPOSITORY,,}"
          observability="${gateway}-observability"
          gamejam_promotions="${gateway}-gamejam-promotions"
          echo "gateway=$gateway" >> "$GITHUB_OUTPUT"
          echo "observability=$observability" >> "$GITHUB_OUTPUT"
          echo "gamejam_promotions=$gamejam_promotions" >> "$GITHUB_OUTPUT"
          echo "GATEWAY_IMAGE=$gateway" >> "$GITHUB_ENV"
          echo "OBSERVABILITY_IMAGE=$observability" >> "$GITHUB_ENV"
          echo "GAMEJAM_PROMOTIONS_IMAGE=$gamejam_promotions" >> "$GITHUB_ENV"

      - name: Build gateway image
        run: |
          docker build \
            --build-arg BINARY=./cmd/gateway \
            -t "$GATEWAY_IMAGE:latest" \
            -t "$GATEWAY_IMAGE:${{ github.sha }}" \
            .

      - name: Build observability API image
        run: |
          docker build \
            --build-arg BINARY=./cmd/observability-api \
            -t "$OBSERVABILITY_IMAGE:latest" \
            -t "$OBSERVABILITY_IMAGE:${{ github.sha }}" \
            .

      - name: Build game jam promotions image
        run: |
          docker build \
            --build-arg BINARY=./cmd/gamejam-promotions \
            -t "$GAMEJAM_PROMOTIONS_IMAGE:latest" \
            -t "$GAMEJAM_PROMOTIONS_IMAGE:${{ github.sha }}" \
            .

      - name: Push images
        run: |
          docker push "$GATEWAY_IMAGE:latest"
          docker push "$GATEWAY_IMAGE:${{ github.sha }}"
          docker push "$OBSERVABILITY_IMAGE:latest"
          docker push "$OBSERVABILITY_IMAGE:${{ github.sha }}"
          docker push "$GAMEJAM_PROMOTIONS_IMAGE:latest"
          docker push "$GAMEJAM_PROMOTIONS_IMAGE:${{ github.sha }}"

  gateway-update:
    if: ${{ needs.build.result == 'success' && vars.K3S_AUTO_DEPLOY == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        env:
          SERVER_DNS_NAME: ${{ secrets.SERVER_DNS_NAME }}
          SERVER_LOGIN: ${{ secrets.SERVER_LOGIN }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SERVER_DNS_NAME" || { echo "SERVER_DNS_NAME is empty"; exit 1; }
          test -n "$SERVER_LOGIN" || { echo "SERVER_LOGIN is empty"; exit 1; }
          test -n "$SERVER_PASSWORD" || { echo "SERVER_PASSWORD is empty"; exit 1; }

          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -H "$SERVER_DNS_NAME" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "Could not read the VPS SSH host key"; exit 1; }
          chmod 600 ~/.ssh/known_hosts

          askpass="$RUNNER_TEMP/ruleshift-ssh-askpass"
          printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$SERVER_PASSWORD"' > "$askpass"
          chmod 700 "$askpass"
          echo "SSH_ASKPASS=$askpass" >> "$GITHUB_ENV"
          echo "SSH_ASKPASS_REQUIRE=force" >> "$GITHUB_ENV"
          echo "DISPLAY=:0" >> "$GITHUB_ENV"

      - name: Run gateway updater
        env:
          SERVER_DNS_NAME: ${{ secrets.SERVER_DNS_NAME }}
          SERVER_LOGIN: ${{ secrets.SERVER_LOGIN }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          remote="${SERVER_LOGIN}@${SERVER_DNS_NAME}"
          ssh_options=(
            -o BatchMode=no
            -o PreferredAuthentications=password,keyboard-interactive
            -o PubkeyAuthentication=no
            -o NumberOfPasswordPrompts=1
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )
          timeout --signal=TERM --kill-after=30s 600s \
            setsid -w ssh "${ssh_options[@]}" "$remote" \
            "ruleshift-update-gateway ghcr.io/ruleshift/server:${{ github.sha }}"

      - name: Remove SSH password helper
        if: always()
        run: |
          rm -f "${SSH_ASKPASS:-}"
