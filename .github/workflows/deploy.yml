name: Build, publish, and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ruleshift-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      gateway_image: ${{ steps.images.outputs.gateway }}
      observability_image: ${{ steps.images.outputs.observability }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set image names
        id: images
        shell: bash
        run: |
          gateway="ghcr.io/${GITHUB_REPOSITORY,,}"
          observability="${gateway}-observability"
          echo "gateway=$gateway" >> "$GITHUB_OUTPUT"
          echo "observability=$observability" >> "$GITHUB_OUTPUT"
          echo "GATEWAY_IMAGE=$gateway" >> "$GITHUB_ENV"
          echo "OBSERVABILITY_IMAGE=$observability" >> "$GITHUB_ENV"

      - name: Build gateway image
        run: |
          docker build \
            --build-arg BINARY=./cmd/gateway \
            -t "$GATEWAY_IMAGE:latest" \
            -t "$GATEWAY_IMAGE:${{ github.sha }}" \
            .

      - name: Build observability API image
        run: |
          docker build \
            --build-arg BINARY=./cmd/observability-api \
            -t "$OBSERVABILITY_IMAGE:latest" \
            -t "$OBSERVABILITY_IMAGE:${{ github.sha }}" \
            .

      - name: Push images
        run: |
          docker push "$GATEWAY_IMAGE:latest"
          docker push "$GATEWAY_IMAGE:${{ github.sha }}"
          docker push "$OBSERVABILITY_IMAGE:latest"
          docker push "$OBSERVABILITY_IMAGE:${{ github.sha }}"

  deploy:
    if: vars.K3S_AUTO_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.K3S_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.K3S_VPS_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.K3S_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" || { echo "K3S_SSH_KEY is empty"; exit 1; }
          test -n "$SSH_PASSPHRASE" || { echo "K3S_VPS_PASSPHRASE is empty"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "K3S_SSH_KNOWN_HOSTS is empty"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | sed 's/\r$//' > ~/.ssh/ruleshift_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ruleshift_deploy ~/.ssh/known_hosts

          agent_socket="$RUNNER_TEMP/ruleshift-ssh-agent.sock"
          eval "$(ssh-agent -a "$agent_socket" -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          askpass="$RUNNER_TEMP/ruleshift-ssh-askpass"
          printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$SSH_PASSPHRASE"' > "$askpass"
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          if ! SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
            timeout --signal=TERM 15s setsid -w ssh-add ~/.ssh/ruleshift_deploy </dev/null; then
            echo "Failed to unlock K3S_SSH_KEY; verify K3S_VPS_PASSPHRASE"
            exit 1
          fi
          rm -f "$askpass"
          trap - EXIT

          ssh-add -L > ~/.ssh/ruleshift_deploy.pub
          echo "Deploy key fingerprint:"
          ssh-keygen -lf ~/.ssh/ruleshift_deploy.pub

      - name: Render k3s manifests
        env:
          OBSERVABILITY_IMAGE: ${{ needs.build.outputs.observability_image }}
        run: |
          kubectl kustomize deploy/k3s/observability --load-restrictor=LoadRestrictionsNone > /tmp/ruleshift-observability.yaml
          sed -i "s#image: ghcr.io/ruleshift/server-observability:latest#image: ${OBSERVABILITY_IMAGE}:${{ github.sha }}#" /tmp/ruleshift-observability.yaml

      - name: Deploy to k3s
        env:
          VPS_HOST: ${{ secrets.K3S_VPS_HOST }}
          VPS_USER: ${{ secrets.K3S_VPS_USER }}
          GATEWAY_IMAGE: ${{ needs.build.outputs.gateway_image }}
          OBSERVABILITY_IMAGE: ${{ needs.build.outputs.observability_image }}
        run: |
          remote="${VPS_USER}@${VPS_HOST}"
          ssh_options=(-i "$HOME/.ssh/ruleshift_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          ssh "${ssh_options[@]}" "$remote" "k3s kubectl -n ruleshift-core get secret ruleshift-observability-secret >/dev/null && k3s kubectl -n ruleshift-core get secret ruleshift-grafana-admin >/dev/null"
          ssh "${ssh_options[@]}" "$remote" "k3s kubectl apply -f -" < /tmp/ruleshift-observability.yaml
          ssh "${ssh_options[@]}" "$remote" "k3s kubectl -n ruleshift-core set env deployment/ruleshift-gateway --from=configmap/ruleshift-gateway-observability --from=secret/ruleshift-observability-secret"
          ssh "${ssh_options[@]}" "$remote" "k3s kubectl -n ruleshift-core set image deployment/ruleshift-gateway gateway=${GATEWAY_IMAGE}:${{ github.sha }}"
          ssh "${ssh_options[@]}" "$remote" "k3s kubectl -n ruleshift-core rollout status deployment/ruleshift-gateway --timeout=180s"
          ssh "${ssh_options[@]}" "$remote" "k3s kubectl -n ruleshift-core rollout status deployment/ruleshift-observability-api --timeout=180s"

      - name: Stop SSH agent
        if: always()
        run: |
          if [[ -n "${SSH_AGENT_PID:-}" ]]; then
            ssh-agent -k
          fi
