syntax = "proto3";

package ruleshift.v2;

import "google/protobuf/any.proto";

option go_package = "github.com/Ruleshift/server/internal/protocol/generated/go/ruleshiftv2;ruleshiftv2";
option csharp_namespace = "Ruleshift.Protocol.V2";

message ClientEnvelope {
  uint32 protocol_version = 1;
  uint64 client_sequence = 2;
  oneof payload {
    AuthRequest auth_request = 10;
    JoinRoomRequest join_room = 11;
    GameCommand game_command = 12;
    SnapshotRequest snapshot_request = 13;
    Ping ping = 14;
  }
}

message ServerEnvelope {
  uint32 protocol_version = 1;
  uint64 server_sequence = 2;
  oneof payload {
    AuthOk auth_ok = 10;
    AuthFailed auth_failed = 11;
    JoinRoomOk join_room_ok = 12;
    StateSnapshot state_snapshot = 13;
    StateDelta state_delta = 14;
    ErrorMessage error = 15;
    Pong pong = 16;
  }
}

message AuthRequest { string ticket = 1; }

message AuthOk {
  string player_id = 1;
  string display_name = 2;
}

message AuthFailed { string reason = 1; }

enum JoinMode {
  JOIN_MODE_UNSPECIFIED = 0;
  JOIN_MODE_PLAYER = 1;
  JOIN_MODE_SPECTATOR = 2;
}

enum ViewScope {
  VIEW_SCOPE_UNSPECIFIED = 0;
  VIEW_SCOPE_PLAYER = 1;
  VIEW_SCOPE_PUBLIC = 2;
  VIEW_SCOPE_FULL = 3;
}

message ModuleRef {
  string module_id = 1;
  string version = 2;
}

message JoinRoomRequest {
  string invite_code = 1;
  uint64 last_seen_revision = 2;
  JoinMode join_mode = 3;
}

message JoinRoomOk {
  string room_id = 1;
  uint64 current_revision = 2;
  JoinMode join_mode = 3;
  ViewScope view_scope = 4;
  ModuleRef module = 5;
}

message GameCommand {
  string room_id = 1;
  uint64 expected_revision = 2;
  google.protobuf.Any command = 3;
}

message StateSnapshot {
  string room_id = 1;
  uint64 revision = 2;
  ModuleRef module = 3;
  bytes view_digest = 4;
  google.protobuf.Any state = 5;
}

message StateDelta {
  string room_id = 1;
  uint64 previous_revision = 2;
  uint64 new_revision = 3;
  string changed_by_player_id = 4;
  ModuleRef module = 5;
  bytes view_digest = 6;
  bool no_visible_change = 7;
  google.protobuf.Any delta = 8;
}

message SnapshotRequest {
  string room_id = 1;
  uint64 last_seen_revision = 2;
}

message ErrorMessage {
  string code = 1;
  string message = 2;
}

message Ping { int64 client_time_unix_ms = 1; }

message Pong {
  int64 client_time_unix_ms = 1;
  int64 server_time_unix_ms = 2;
}
