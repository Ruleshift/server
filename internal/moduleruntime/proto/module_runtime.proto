syntax = "proto3";

package ruleshift.module.v2;

import "google/protobuf/any.proto";

option go_package = "github.com/Ruleshift/server/internal/moduleruntime/generated/moduleruntimev2;moduleruntimev2";
option csharp_namespace = "Ruleshift.Module.V2";

service ModuleRuntime {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc CreateState(CreateStateRequest) returns (TransitionResponse);
  rpc Apply(ApplyRequest) returns (TransitionResponse);
  rpc ProjectSnapshot(ProjectRequest) returns (ProjectionResponse);
  rpc ProjectDelta(ProjectDeltaRequest) returns (ProjectionResponse);
}

enum ViewScope {
  VIEW_SCOPE_UNSPECIFIED = 0;
  VIEW_SCOPE_PLAYER = 1;
  VIEW_SCOPE_PUBLIC = 2;
  VIEW_SCOPE_FULL = 3;
}

// DeterministicContext contains only authoritative values that may affect game
// rules. Connection, room-membership, and operation-tracing data are excluded.
message DeterministicContext {
  uint64 revision = 1;
  int64 now_unix_ms = 2;
  uint64 seed = 3;
}

// GameSetup is immutable for a room. Players are assigned to these zero-based
// seats by Ruleshift Core; the module does not process joins or connections.
message GameSetup {
  uint32 player_count = 1;
}

// Actor is supplied by Ruleshift after authentication and seat resolution.
// It is never accepted from the client command payload.
message Actor {
  string player_id = 1;
  uint32 seat_index = 2;
}

// Viewer is resolved by Ruleshift. Spectators have no seat_index.
message Viewer {
  string player_id = 1;
  optional uint32 seat_index = 2;
  ViewScope scope = 3;
}

message DescribeRequest {}

message DescribeResponse {
  string module_id = 1;
  string version = 2;
  uint32 abi_version = 3;
  string state_type_url = 4;
  repeated string command_type_urls = 5;
  bytes descriptor_set_sha256 = 6;
}

message CreateStateRequest {
  DeterministicContext context = 1;
  GameSetup setup = 2;
}

message ApplyRequest {
  DeterministicContext context = 1;
  google.protobuf.Any state = 2;
  Actor actor = 3;
  google.protobuf.Any command = 4;
}

message TransitionResponse {
  bool changed = 1;
  google.protobuf.Any next_state = 2;
  google.protobuf.Any delta = 3;
}

message ProjectRequest {
  DeterministicContext context = 1;
  google.protobuf.Any state = 2;
  Viewer viewer = 3;
}

message ProjectDeltaRequest {
  DeterministicContext context = 1;
  google.protobuf.Any before_state = 2;
  google.protobuf.Any after_state = 3;
  google.protobuf.Any delta = 4;
  Viewer viewer = 5;
}

message ProjectionResponse {
  google.protobuf.Any payload = 1;
  bool no_visible_change = 2;
}
